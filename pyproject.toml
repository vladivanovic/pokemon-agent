[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-agent"
version = "0.2.0"
description = "Deterministic-first Pokemon Red player: ROM-truth world model, RAM state, validated goals, optional LLM supervision."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pyboy = ["pyboy>=2.0.0"]

[tool.setuptools.packages.find]
include = ["agent*"]
